<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mekdim Mulugeta | Art Gallery</title>
    <!-- Font Awesome 6 (required for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a192f 0%, #0f2a3f 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .hub-card {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Profile Section */
        .profile-section {
            background: #ffffff;
            padding: 2.5rem 2rem 1.5rem 2rem;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.2);
        }

        .avatar i {
            font-size: 3.5rem;
            color: white;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0a192f;
            margin-bottom: 0.75rem;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            font-size: 0.85rem;
            color: #4b6e8a;
            background: #f0f4fa;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            margin: 0 auto 1rem auto;
            width: fit-content;
        }

        .contact-info i {
            margin-right: 6px;
            color: #2c6288;
            width: 20px;
        }

        .divider {
            height: 1px;
            background: #eef2f8;
            margin: 1rem 0;
        }

        .title {
            color: #4b6e8a;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .title i {
            font-size: 1rem;
            color: #2c5f8a;
        }

        /* Buttons Container - PERFECT CENTERING */
        .links-container {
            padding: 0 2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        /* Base button style - ALL BUTTONS IDENTICAL */
        .social-button {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.25s ease;
            border: 1px solid #e2edf7;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            color: #1f2f3e;
            cursor: pointer;
            width: 100%;
            gap: 14px;
        }

        /* Icon styling - consistent width for perfect alignment */
        .social-button i {
            font-size: 1.5rem;
            width: 32px;
            text-align: center;
            transition: transform 0.2s;
        }

        /* Text styling */
        .social-button span {
            flex: 1;
            text-align: left;
            font-weight: 600;
        }

        /* Hover effects */
        .social-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -10px rgba(0,0,0,0.15);
        }

        .social-button:hover i {
            transform: scale(1.05);
        }

        /* Works Button */
        .works-btn {
            background: #f8fafd;
            border: 1px solid #e2edf7;
        }

        .works-btn i {
            color: #e67e22;
        }

        .works-btn:hover {
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-color: transparent;
            color: white;
        }

        .works-btn:hover i {
            color: white;
        }

        /* Facebook Button */
        .facebook-btn {
            background: white;
        }

        .facebook-btn i {
            color: #1877F2;
        }

        .facebook-btn:hover {
            background: #1877F2;
            border-color: #1877F2;
            color: white;
        }

        .facebook-btn:hover i {
            color: white;
        }

        /* TikTok Button */
        .tiktok-btn i {
            color: #010101;
        }

        .tiktok-btn:hover {
            background: #010101;
            border-color: #010101;
            color: white;
        }

        .tiktok-btn:hover i {
            color: white;
        }

        /* Instagram Button */
        .instagram-btn i {
            color: #e4405f;
        }

        .instagram-btn:hover {
            background: linear-gradient(135deg, #fdf497, #fd5949, #d6249f);
            border-color: transparent;
            color: white;
        }

        .instagram-btn:hover i {
            color: white;
        }

        /* Footer */
        .footer-note {
            background: #f8fafd;
            padding: 1rem;
            font-size: 0.7rem;
            color: #5a7a9a;
            border-top: 1px solid #eef2f8;
            text-align: center;
        }

        /* Modal Styles */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 16px;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 1.3rem;
        }

        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .hub-card { border-radius: 32px; }
            .profile-section { padding: 1.8rem 1.5rem 1.2rem 1.5rem; }
            .links-container { padding: 0 1.5rem 1.5rem 1.5rem; }
            .social-button { padding: 0.8rem 1.2rem; font-size: 1rem; }
            .social-button i { font-size: 1.3rem; width: 28px; }
            .contact-info { font-size: 0.75rem; gap: 0.75rem; }
            .nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }
    </style>
</head>
<body>
    <div class="hub-card">
        <div class="profile-section">
            <div class="avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1>Mekdim Mulugeta</h1>
            <div class="contact-info">
                <span><i class="fas fa-phone-alt"></i> +251947325665</span>
                <span><i class="fas fa-envelope"></i> mulugetamekedim438@gmail.com</span>
            </div>
            <div class="divider"></div>
            <div class="title">
                <i class="fas fa-palette"></i> Artist | Creator
            </div>
        </div>

        <div class="links-container">
            <!-- Check Out My Works Button -->
            <button class="social-button works-btn" id="viewWorksBtn">
                <i class="fas fa-palette"></i>
                <span>Check Out My Works</span>
            </button>

            <!-- Facebook -->
            <a href="https://www.facebook.com/mekdim.mulugeta.2025" 
               class="social-button facebook-btn" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
            
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@mekdimmulugeta" 
               class="social-button tiktok-btn" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/mekdimmulugeta" 
               class="social-button instagram-btn" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
        </div>

        <div class="footer-note">
            <i class="fas fa-qrcode"></i> Scan to connect — tap any button to visit my profile
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="galleryModal" class="gallery-modal">
        <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
        <div class="modal-content">
            <button class="nav-btn prev-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <img id="galleryImage" class="gallery-image" src="" alt="Artwork">
            <button class="nav-btn next-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="image-counter" id="imageCounter">1 / 14</div>
    </div>

    <script>
        // ========== ARTWORK IMAGES FROM LOCAL FOLDER ==========
        // All images are in folder named "M" with file names 1.jpg to 14.jpg
        // Make sure your folder structure is: /M/1.jpg, /M/2.jpg, ... /M/14.jpg
        const artworks = [];
        
        // Generate image paths from 1 to 14
        for (let i = 1; i <= 14; i++) {
            artworks.push(`M/${i}.jpg`);
        }
        
        // Optional: Add titles for each artwork (you can customize these)
        const artworkTitles = [
            "Artwork 1", "Artwork 2", "Artwork 3", "Artwork 4",
            "Artwork 5", "Artwork 6", "Artwork 7", "Artwork 8",
            "Artwork 9", "Artwork 10", "Artwork 11", "Artwork 12",
            "Artwork 13", "Artwork 14"
        ];

        let currentIndex = 0;
        const totalArtworks = artworks.length;
        
        const modal = document.getElementById('galleryModal');
        const viewBtn = document.getElementById('viewWorksBtn');
        const galleryImage = document.getElementById('galleryImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const imageCounter = document.getElementById('imageCounter');

        function updateImage() {
            galleryImage.src = artworks[currentIndex];
            galleryImage.alt = artworkTitles[currentIndex] || `Artwork ${currentIndex + 1}`;
            imageCounter.textContent = `${currentIndex + 1} / ${totalArtworks}`;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % totalArtworks;
            updateImage();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + totalArtworks) % totalArtworks;
            updateImage();
        }

        function openModal() {
            modal.style.display = 'flex';
            currentIndex = 0;
            updateImage();
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        viewBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', nextImage);
        prevBtn.addEventListener('click', prevImage);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowRight') nextImage();
                else if (e.key === 'ArrowLeft') prevImage();
                else if (e.key === 'Escape') closeModal();
            }
        });
        
        // Optional: Log to console to confirm image paths
        console.log(`Loaded ${totalArtworks} artwork images from M/ folder`);
        console.log('First image path:', artworks[0]);
    </script>
</body>
</html>
