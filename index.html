<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mekdim Mulugeta | Art Gallery</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a192f 0%, #0f2a3f 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .hub-card {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 48px;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            text-align: center;
        }

        .profile-section {
            background: #ffffff;
            padding: 2rem 2rem 1rem 2rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.2);
        }

        .avatar i {
            font-size: 3.5rem;
            color: white;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0a192f;
            margin-bottom: 0.25rem;
        }

        .contact-info {
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #4b6e8a;
            background: #f0f4fa;
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
        }

        .contact-info i {
            margin-right: 6px;
            color: #2c6288;
        }

        .divider {
            height: 1px;
            background: #eef2f8;
            margin: 1rem 0 0.5rem 0;
        }

        .links-container {
            padding: 0 2rem 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: white;
            padding: 1rem 1rem;
            border-radius: 80px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.25s ease;
            border: 1px solid #e2edf7;
            color: #1f2f3e;
            cursor: pointer;
        }

        .social-button i {
            font-size: 1.8rem;
            transition: transform 0.2s;
        }

        .social-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(0,0,0,0.2);
        }

        .social-button:hover i {
            transform: scale(1.05);
        }

        .works-btn {
            background: linear-gradient(135deg, #2c5f8a, #1e3a5f);
            color: white;
            border: none;
        }

        .works-btn i {
            color: white;
        }

        .works-btn:hover {
            background: linear-gradient(135deg, #3b7aaa, #2c4c6e);
        }

        /* Gallery Modal Styles */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 1.5rem;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.05);
        }

        .prev-btn {
            left: 20px;
        }

        .next-btn {
            right: 20px;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 1.3rem;
            transition: all 0.2s;
        }

        .close-modal:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.05);
        }

        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .footer-note {
            background: #f8fafd;
            padding: 1rem;
            font-size: 0.7rem;
            color: #5a7a9a;
            border-top: 1px solid #eef2f8;
            text-align: center;
        }

        @media (max-width: 480px) {
            .hub-card { border-radius: 32px; }
            .social-button { padding: 0.85rem 1rem; font-size: 1rem; }
            .social-button i { font-size: 1.6rem; }
            .nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }
    </style>
</head>
<body>
    <div class="hub-card">
        <div class="profile-section">
            <div class="avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1>Mekdim Mulugeta</h1>
            <div class="contact-info">
                <i class="fas fa-phone-alt"></i> +251947325665
                <i class="fas fa-envelope"></i> mulugetamekedim438@gmail.com
            </div>
            <div class="divider"></div>
            <div class="title" style="margin-top: 12px; color: #4b6e8a; font-size: 0.9rem;">
                <i class="fas fa-palette"></i> Artist | Creator
            </div>
        </div>

        <div class="links-container">
            <!-- Check Out My Works Button -->
            <button class="social-button works-btn" id="viewWorksBtn">
                <i class="fas fa-music"></i>
                <span>Check Out My Works</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <!-- Social Links -->
            <a href="https://www.facebook.com/mekdim.mulugeta.2025" 
               class="social-button facebook-btn" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
            
            <a href="https://www.tiktok.com/@mekdimmulugeta" 
               class="social-button tiktok-btn" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>

            <a href="https://www.instagram.com/mekdimmulugeta" 
               class="social-button instagram-btn" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
        </div>

        <div class="footer-note">
            <i class="fas fa-qrcode"></i> Scan to connect — tap any button to visit my profile
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="galleryModal" class="gallery-modal">
        <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
        <div class="modal-content">
            <button class="nav-btn prev-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <img id="galleryImage" class="gallery-image" src="" alt="Artwork">
            <button class="nav-btn next-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="image-counter" id="imageCounter">1 / 1</div>
    </div>

    <script>
        // ========== SAMPLE ARTWORK IMAGES ==========
        // REPLACE THESE URLS WITH YOUR ACTUAL ARTWORK IMAGES
        // You can use:
        // - Online image URLs (like from Imgur, Google Drive shared links)
        // - Or local paths like "images/art1.jpg" if you upload them with your page
        const artworks = [
            "https://placehold.co/800x600/2c5f8a/white?text=Artwork+1+-+Replace+with+your+image",
            "https://placehold.co/800x600/1e3a5f/white?text=Artwork+2+-+Replace+with+your+image",
            "https://placehold.co/800x600/4b6e8a/white?text=Artwork+3+-+Replace+with+your+image",
            "https://placehold.co/800x600/833ab4/white?text=Artwork+4+-+Replace+with+your+image"
        ];
        
        // You can also add descriptions if needed
        const artworkTitles = [
            "Abstract Flow",
            "Urban Dreams", 
            "Nature's Whisper",
            "Digital Soul"
        ];

        let currentIndex = 0;
        
        // DOM Elements
        const modal = document.getElementById('galleryModal');
        const viewBtn = document.getElementById('viewWorksBtn');
        const galleryImage = document.getElementById('galleryImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const imageCounter = document.getElementById('imageCounter');

        // Function to update the displayed image
        function updateImage() {
            galleryImage.src = artworks[currentIndex];
            galleryImage.alt = artworkTitles[currentIndex] || `Artwork ${currentIndex + 1}`;
            imageCounter.textContent = `${currentIndex + 1} / ${artworks.length}`;
        }

        // Next image
        function nextImage() {
            currentIndex = (currentIndex + 1) % artworks.length;
            updateImage();
        }

        // Previous image
        function prevImage() {
            currentIndex = (currentIndex - 1 + artworks.length) % artworks.length;
            updateImage();
        }

        // Open modal
        function openModal() {
            modal.style.display = 'flex';
            currentIndex = 0;
            updateImage();
            // Prevent body scrolling when modal is open
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        // Event Listeners
        viewBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', nextImage);
        prevBtn.addEventListener('click', prevImage);

        // Close modal when clicking outside the image area
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowRight') {
                    nextImage();
                } else if (e.key === 'ArrowLeft') {
                    prevImage();
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            }
        });
    </script>
</body>
</html>
